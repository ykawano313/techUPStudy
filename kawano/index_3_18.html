<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-15課題</title>
</head>

<body>  
    <form name="myform">
        <input id="num" type="number" value="0" />
        <button id="btn" type="button">ボタン</button>

        <script>
            document.getElementById('btn').onclick = function () {
                const elm = document.getElementById('num')
                elm.stepUp(); 
            }
        </script>
    </form>
</body>

</html>
